<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú Digital - Pedidos</title>
<style>
:root {
  --site-primary: #0E5A4A;
  --site-secondary: #1FA855;
  --site-background: #F3F6F4;
  --site-on-primary: #FFFFFF;
  --site-on-secondary: #FFFFFF;
  --site-on-background: #16231F;
  --site-font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --site-font-heading: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --site-heading-scale: 1;
  --site-spacing-scale: 1;
  --site-radius-scale: 1;
  --site-decoration-opacity: 1;
}
* { box-sizing: border-box; margin: 0; }
body { margin: 0; font-family: var(--site-font-body); background: var(--site-background); color: var(--site-on-background); padding-bottom: 40px; }
#app { min-height: 100vh; width: 100%; background-color: light-dark(var(--site-background), #17211E); color: light-dark(var(--site-on-background), #F1F5F3); border-radius: 0; }
header { background: var(--site-primary); color: var(--site-on-primary); padding: calc(22px * var(--site-spacing-scale)) 18px; text-align: center; }
header h1 { font-family: var(--site-font-heading); font-size: calc(1.5rem * var(--site-heading-scale)); }
header p { font-size: .9rem; opacity: .88; margin-top: 4px; }
main { max-width: 560px; margin: 0 auto; padding: calc(16px * var(--site-spacing-scale)); }
.producto { background: light-dark(#FFFFFF, #202D28); border: 1px solid #DCE4E0; border-radius: calc(14px * var(--site-radius-scale)); padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.producto.agotado { border: 1.5px solid #D93025; background: light-dark(#FFF1F0, #382321); }
.producto.agotado .datos h3, .producto.agotado .precio { color: #D93025; }
.etiquetaAgotado { display: inline-block; margin-top: 5px; padding: 3px 8px; border-radius: 6px; background: #D93025; color: white; font-size: .72rem; font-weight: 800; }
.etiquetaDisponible { display: inline-block; margin-top: 5px; padding: 3px 8px; border-radius: 6px; background: #287A50; color: white; font-size: .72rem; font-weight: 800; }
.etiquetaDisponible[hidden], .etiquetaAgotado[hidden] { display: none !important; }
.cant button:disabled { opacity: .35; cursor: not-allowed; }
.datos h3 { font-size: 1rem; } .datos p { font-size: .85rem; color: #64726D; margin-top: 2px; }
.precio { display: block; margin-top: 4px; font-weight: 800; color: var(--site-primary); }
.cant { display: flex; align-items: center; gap: 8px; flex: none; }
.cant button { width: 38px; height: 38px; border: 0; border-radius: 10px; background: var(--site-primary); color: white; font-size: 1.3rem; cursor: pointer; }
.cant .n { min-width: 22px; text-align: center; font-weight: 700; }
label { display: block; font-weight: 700; font-size: .9rem; margin: 16px 0 6px; }
input, textarea { width: 100%; font: inherit; padding: 12px; border: 1.5px solid #DCE4E0; border-radius: 12px; background: light-dark(#fff,#202D28); color: inherit; }
textarea { min-height: 70px; resize: vertical; }
.total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 800; margin: 20px 0 12px; }
#enviar, #guardarCambios { width: 100%; border: 0; border-radius: 14px; background: var(--site-secondary); color: white; font: inherit; font-weight: 800; padding: 16px; cursor: pointer; }
#borrarPedido { width: 100%; margin-top: 8px; border: 1px solid #DCE4E0; border-radius: 14px; background: transparent; color: #64726D; font: inherit; font-weight: 700; padding: 13px; cursor: pointer; }
#aviso { color: #C0392B; font-weight: 600; margin-top: 10px; min-height: 1.2em; text-align: center; }
#adminAcceso { display: block; margin: 16px auto 0; padding: 8px 12px; border: 1px solid #DCE4E0; border-radius: 10px; background: transparent; color: #64726D; font: inherit; font-size: .8rem; cursor: pointer; }
#adminPanel { display: none; background: light-dark(#fff,#202D28); border: 1px solid #DCE4E0; border-radius: 14px; padding: 14px; margin: 14px 0; }
#adminPanel h2 { font-size: 1.05rem; color: var(--site-primary); margin-bottom: 8px; }
#adminPanel button, .editarProducto, #pinModal button { border: 0; border-radius: 10px; background: var(--site-primary); color: white; padding: 10px 12px; font: inherit; cursor: pointer; }
.adminAcciones, .modalAcciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
#adminPanel .secundario, #pinModal button.cancelar { background: #64726D; }
#guardarCambios { display: block; margin-top: 12px; border-radius: 10px; }
#adminEstado, #pinError { font-size: .82rem; color: #64726D; margin-top: 8px; min-height: 1em; }
#pinError { color: #C0392B; }
#pinModal { display: none; position: fixed; inset: 0; background: #16231F88; z-index: 10; align-items: center; justify-content: center; padding: 18px; }
#pinModal .modalContenido { width: 100%; max-width: 360px; background: light-dark(#fff,#202D28); border-radius: 14px; padding: 18px; }
#pinModal h2 { font-size: 1.1rem; color: var(--site-primary); }
#pinModal button { flex: 1; }
.filaAdmin { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.filaAdmin > * { flex: 1; min-width: 0; }
</style>
</head>
<body>
<div id="app">
<header><h1 id="nombreRestaurante">Mi Restaurante</h1><p>Elige tus productos y envía tu pedido por WhatsApp</p></header>
<main>
  <div id="productos"></div>
  <label for="cliente">Tu nombre</label><input id="cliente" placeholder="Ej. Ana" autocomplete="given-name">
  <label for="nota">Nota <small style="font-weight:400">(opcional)</small></label><textarea id="nota" placeholder="Ej. sin cebolla, para llevar"></textarea>
  <div class="total"><span>Total</span><span id="total"></span></div>
  <button id="enviar" type="button">Enviar pedido por WhatsApp</button>
  <button id="borrarPedido" type="button">Borrar productos seleccionados</button>
  <div id="aviso" role="status"></div>
  <button id="adminAcceso" type="button">Administración</button>
  <section id="adminPanel" aria-label="Administración del menú">
    <h2>Administrar menú</h2><p style="font-size:.85rem;color:#64726D">Agrega productos o modifica los datos y precios existentes.</p>
    <div id="listaEdicion"></div>
    <div class="adminAcciones"><button id="nuevoProducto" type="button">+ Agregar producto</button><button id="cerrarAdmin" class="secundario" type="button">Cerrar</button></div>
    <button id="guardarCambios" type="button">Guardar cambios</button><div id="adminEstado" role="status"></div>
  </section>
</main>
<div id="pinModal" role="dialog" aria-modal="true" aria-labelledby="pinTitulo"><div class="modalContenido">
  <h2 id="pinTitulo">Acceso de administrador</h2><label for="pinEntrada">PIN de 4 dígitos</label><input id="pinEntrada" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
  <div id="pinError"></div><div class="modalAcciones"><button id="validarPin" type="button">Entrar</button><button id="cancelarPin" class="cancelar" type="button">Cancelar</button></div>
</div></div>
</div>
<script>
'use strict';
const miNumero = '50433302312';
const moneda = 'L';
const PIN_ADMIN = '1234';
const CLAVE_MENU = 'menuRestauranteProductos_v1';
const productosIniciales = [
  {nombre:'Baleada sencilla',descripcion:'Frijoles, queso y crema',precio:40},
  {nombre:'Baleada con todo',descripcion:'Huevo, carne, aguacate y más',precio:60},
  {nombre:'Plato de pollo',descripcion:'Con tajadas, ensalada y tortilla',precio:120},
  {nombre:'Refresco',descripcion:'Botella 400 ml',precio:25}
];
let productos = cargarProductos();
let adminActivo = false;
const dinero = n => moneda + ' ' + Number(n).toLocaleString('es');
const contenedorProductos = document.getElementById('productos');
const panelAdmin = document.getElementById('adminPanel');
function cargarProductos(){
  try { const guardados=localStorage.getItem(CLAVE_MENU); if(guardados){const datos=JSON.parse(guardados);if(Array.isArray(datos))return datos;} } catch(e){}
  return productosIniciales.map(p=>({...p}));
}
function guardarProductos(){
  try {localStorage.setItem(CLAVE_MENU,JSON.stringify(productos));document.getElementById('adminEstado').textContent='Cambios guardados en este dispositivo.';return true;}
  catch(e){document.getElementById('adminEstado').textContent='No se pudieron guardar los cambios en este navegador.';return false;}
}
function totalPedido(){return [...document.querySelectorAll('.producto')].reduce((s,f)=>s+Number(productos[Number(f.dataset.indice)].precio)*Number(f.querySelector('.n').textContent),0);}
function actualizar(){document.getElementById('total').textContent=dinero(totalPedido());}
function renderizarProductos(){
  contenedorProductos.innerHTML='';
  productos.forEach((p,indice)=>{
    const disponible=p.disponible!==false;
    const fila=document.createElement('div');fila.className='producto'+(disponible?'':' agotado');fila.dataset.indice=indice;
    fila.innerHTML='<div class="datos"><h3></h3><p></p><span class="precio"></span><span class="etiquetaDisponible">DISPONIBLE</span><span class="etiquetaAgotado">NO DISPONIBLE</span></div><div class="cant"><button type="button" class="menos" aria-label="Quitar">−</button><span class="n">0</span><button type="button" class="mas" aria-label="Agregar">+</button></div>';
    fila.querySelector('h3').textContent=p.nombre;fila.querySelector('p').textContent=p.descripcion;fila.querySelector('.precio').textContent=dinero(p.precio);fila.querySelector('.etiquetaDisponible').hidden=!disponible;fila.querySelector('.etiquetaAgotado').hidden=disponible;fila.querySelectorAll('.cant button').forEach(b=>b.disabled=!disponible);contenedorProductos.appendChild(fila);
  });actualizar();
}
contenedorProductos.addEventListener('click',e=>{
  const fila=e.target.closest('.producto');if(!fila)return;const cantidad=fila.querySelector('.n');
  if(productos[Number(fila.dataset.indice)].disponible===false)return;
  if(e.target.classList.contains('mas'))cantidad.textContent=Number(cantidad.textContent)+1;
  if(e.target.classList.contains('menos'))cantidad.textContent=Math.max(0,Number(cantidad.textContent)-1);actualizar();
});
document.getElementById('borrarPedido').addEventListener('click',()=>{
  document.querySelectorAll('#productos .producto .n').forEach(n=>n.textContent='0');actualizar();
  document.getElementById('aviso').textContent='Pedido borrado. Puedes elegir de nuevo.';
});
function leerCamposProducto(bloque){
  const nombre=bloque.querySelector('[data-campo="nombre"]').value.trim();const precioTexto=bloque.querySelector('[data-campo="precio"]').value;
  const precio=Number(precioTexto);const descripcion=bloque.querySelector('[data-campo="descripcion"]').value.trim();
  if(!nombre||precioTexto===''||!Number.isFinite(precio)||precio<0)return null;return {nombre,descripcion,precio};
}
function renderizarEditor(){
  const lista=document.getElementById('listaEdicion');lista.innerHTML='';
  productos.forEach((p,i)=>{
    const bloque=document.createElement('div');bloque.dataset.indice=i;bloque.style.cssText='border-top:1px solid #DCE4E0;padding:10px 0';
    const titulo=document.createElement('strong');titulo.textContent=p.nombre;titulo.style.fontSize='.9rem';
    const fila=document.createElement('div');fila.className='filaAdmin';
    const nombre=document.createElement('input');nombre.value=p.nombre;nombre.placeholder='Nombre';nombre.setAttribute('aria-label','Nombre del producto');nombre.dataset.campo='nombre';
    const precio=document.createElement('input');precio.type='number';precio.min='0';precio.step='0.01';precio.value=p.precio;precio.placeholder='Precio';precio.setAttribute('aria-label','Precio');precio.dataset.campo='precio';
    const descripcion=document.createElement('input');descripcion.value=p.descripcion;descripcion.placeholder='Descripción';descripcion.setAttribute('aria-label','Descripción');descripcion.dataset.campo='descripcion';
    const guardar=document.createElement('button');guardar.type='button';guardar.className='editarProducto';guardar.textContent='Guardar';
    guardar.addEventListener('click',()=>{const actualizado=leerCamposProducto(bloque);if(!actualizado){document.getElementById('adminEstado').textContent='Revisa el nombre y el precio de este producto.';return;}actualizado.disponible=productos[i].disponible!==false;productos[i]=actualizado;if(guardarProductos()){titulo.textContent=actualizado.nombre;renderizarProductos();document.getElementById('adminEstado').textContent='Producto guardado. Puedes continuar editando los demás.';}});
    const estado=document.createElement('button');estado.type='button';estado.className='editarProducto';estado.style.background=productos[i].disponible===false?'#D93025':'#287A50';estado.textContent=productos[i].disponible===false?'Marcar como disponible':'Marcar como no disponible';
    estado.addEventListener('click',()=>{productos[i].disponible=productos[i].disponible===false;guardarProductos();renderizarProductos();renderizarEditor();document.getElementById('adminEstado').textContent=productos[i].disponible===false?'Producto marcado como no disponible.':'Producto disponible nuevamente.';});
    fila.append(nombre,precio);const fila2=document.createElement('div');fila2.className='filaAdmin';fila2.append(descripcion,guardar);const fila3=document.createElement('div');fila3.className='filaAdmin';fila3.append(estado);bloque.append(titulo,fila,fila2,fila3);lista.appendChild(bloque);
  });
}
function guardarTodosLosCambios(){
  const bloques=[...document.querySelectorAll('#listaEdicion > div')];const actualizados=[];
  for(let i=0;i<bloques.length;i++){const producto=leerCamposProducto(bloques[i]);if(!producto){document.getElementById('adminEstado').textContent='Revisa el nombre y el precio del producto '+(i+1)+'.';bloques[i].querySelector('[data-campo="nombre"]').focus();return;}producto.disponible=productos[i].disponible!==false;actualizados.push(producto);}
  productos=actualizados;if(guardarProductos()){renderizarProductos();renderizarEditor();document.getElementById('adminEstado').textContent='¡Todos los cambios se guardaron correctamente!';}
}
document.getElementById('guardarCambios').addEventListener('click',guardarTodosLosCambios);
document.getElementById('nuevoProducto').addEventListener('click',()=>{
  const bloques=[...document.querySelectorAll('#listaEdicion > div')];const actualizados=[];
  for(let i=0;i<bloques.length;i++){const producto=leerCamposProducto(bloques[i]);if(!producto){document.getElementById('adminEstado').textContent='Completa correctamente los datos del producto '+(i+1)+' antes de agregar otro.';return;}actualizados.push(producto);}
  productos=actualizados;productos.push({nombre:'Nuevo producto',descripcion:'',precio:0,disponible:true});if(guardarProductos()){renderizarProductos();renderizarEditor();document.getElementById('adminEstado').textContent='Producto agregado. Completa sus datos y pulsa Guardar.';}
});
function abrirAdmin(){adminActivo=true;document.getElementById('pinModal').style.display='none';panelAdmin.style.display='block';document.getElementById('adminAcceso').textContent='Administración abierta';document.getElementById('adminEstado').textContent='';renderizarEditor();}
function cerrarAdmin(){adminActivo=false;panelAdmin.style.display='none';document.getElementById('adminAcceso').textContent='Administración';}
document.getElementById('adminAcceso').addEventListener('click',()=>{if(adminActivo){panelAdmin.style.display='block';return;}document.getElementById('pinEntrada').value='';document.getElementById('pinError').textContent='';document.getElementById('pinModal').style.display='flex';document.getElementById('pinEntrada').focus();});
function comprobarPin(){if(document.getElementById('pinEntrada').value===PIN_ADMIN)abrirAdmin();else document.getElementById('pinError').textContent='PIN incorrecto. Intenta nuevamente.';}
document.getElementById('validarPin').addEventListener('click',comprobarPin);
document.getElementById('pinEntrada').addEventListener('keydown',e=>{if(e.key==='Enter')comprobarPin();});
document.getElementById('cancelarPin').addEventListener('click',()=>document.getElementById('pinModal').style.display='none');
document.getElementById('cerrarAdmin').addEventListener('click',cerrarAdmin);
document.getElementById('enviar').addEventListener('click',()=>{
  const aviso=document.getElementById('aviso');const cliente=document.getElementById('cliente').value.trim();const nota=document.getElementById('nota').value.trim();
  const items=[...document.querySelectorAll('.producto')].map(f=>({nombre:productos[Number(f.dataset.indice)].nombre,precio:Number(productos[Number(f.dataset.indice)].precio),cant:Number(f.querySelector('.n').textContent)})).filter(i=>i.cant>0);
  if(!items.length){aviso.textContent='Agrega al menos un producto con +.';return;}if(!cliente){aviso.textContent='Escribe tu nombre.';document.getElementById('cliente').focus();return;}
  const numero=String(miNumero).replace(/\D/g,'');if(numero.length<8){aviso.textContent='Falta configurar el número de WhatsApp en el código.';return;}aviso.textContent='';
  const nombreNegocio=document.getElementById('nombreRestaurante').textContent;const lineas=items.map(i=>'• '+i.cant+' x '+i.nombre+' — '+dinero(i.precio*i.cant));
  const mensaje=['*Nuevo pedido — '+nombreNegocio+'*','','Cliente: '+cliente,'','*Pedido:*',...lineas,nota?'':null,nota?'Nota: '+nota:null,'','*Total: '+dinero(totalPedido())+'*'].filter(x=>x!==null).join('\n');
  window.open('https://wa.me/'+numero+'?text='+encodeURIComponent(mensaje),'_blank');
});
renderizarProductos();
</script>
</body>
</html>
